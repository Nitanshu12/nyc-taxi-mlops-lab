# CI (S0): the grader's static checks, `make check`, on every push and pull request; on pushes to
# main, also build the linux/arm64 app image and push it to GHCR.
# GitHub-hosted runners only: this workflow triggers on pull_request, so no job here may ever run on
# a self-hosted runner (tools/check_workflows.py enforces it). Deploying is cd.yaml's job.
#
# Image tag scheme (decisions/): <run number>-<short sha>, e.g. 42-5a5c93e. The image job hands the
# tag to cd.yaml as the `image-tag` artifact, so CD deploys exactly what CI built.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: make check

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name and tag
        id: img
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$prefix/app:$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is this tag already pushed?
        # A re-run keeps the run number, so it would rebuild the same tag. Tags never move: if it
        # exists, keep the image that is there.
        id: exists
        run: |
          if docker buildx imagetools inspect "${{ steps.img.outputs.ref }}" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.img.outputs.ref }} already exists; not rebuilding it"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7.4.0
        if: steps.exists.outputs.already == 'false'
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.img.outputs.ref }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Hand the tag to CD
        run: printf '%s\n' "${{ steps.img.outputs.tag }}" > image-tag
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: image-tag
          path: image-tag
          retention-days: 30
